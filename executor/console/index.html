<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Executor console</title>
<style>
:root{
  --bg:#f3f1ec;--panel:#fbfaf7;--ink:#1d1c1a;--mut:#67635b;--faint:#8f8a80;--line:#e1ddd4;--line2:#d2cdc2;
  --acc:#0e6a63;--acc-ink:#fff;--ok:#1d7448;--ok-bg:#e3f1e8;--warn:#8f5600;--warn-bg:#f8ecd6;--bad:#a8291f;--bad-bg:#f7e2df;
  --info:#2b5cab;--info-bg:#e4ebf7;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--r:12px}
@media (prefers-color-scheme:dark){:root{
  --bg:#141413;--panel:#1c1c1a;--ink:#ecebe7;--mut:#a6a299;--faint:#7d796f;--line:#2c2b28;--line2:#3a3934;
  --acc:#3fb3a6;--acc-ink:#06201d;--ok:#5fcf91;--ok-bg:#16301f;--warn:#e9b25c;--warn-bg:#33270f;--bad:#ff8a7a;--bad-bg:#3a1b17;
  --info:#8fb3ff;--info-bg:#18233a}}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body{margin:0}
::selection{background:color-mix(in srgb,var(--acc) 28%,transparent)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
a{color:var(--acc);text-underline-offset:3px}
h1{font-size:17px;font-weight:650;letter-spacing:-.01em;margin:0}
h2{font-size:13px;font-weight:650;margin:0 0 10px;color:var(--ink)}
.mut{color:var(--mut)}.faint{color:var(--faint)}.mono{font-family:var(--mono);font-size:12.5px}
header{position:sticky;top:0;z-index:5;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 20px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);
  font-size:12.5px;color:var(--mut);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--ok)}.dot.busy{background:var(--warn);animation:pulse 1.2s ease-in-out infinite}.dot.bad{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}
main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;padding:16px 20px 40px;max-width:1680px;margin:0 auto}
@media (max-width:1000px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
textarea,select,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line2);
  border-radius:8px;padding:8px 10px}
textarea{min-height:96px;resize:vertical}
textarea.code{font-family:var(--mono);font-size:12.5px;min-height:64px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>select{flex:1;min-width:0}
button{font:inherit;font-weight:600;padding:7px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);
  color:var(--ink);cursor:pointer;transition:background .15s ease-out,border-color .15s ease-out}
button:hover:not(:disabled){border-color:var(--faint)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line2))}
button.danger:hover:not(:disabled){background:var(--bad-bg)}
.msg{font-size:12.5px;color:var(--mut);min-height:18px;margin-top:8px}
.msg.err{color:var(--bad)}
.switch{display:flex;gap:10px;align-items:center;padding:10px;border-radius:8px;border:1px dashed var(--line2);margin-top:10px}
.switch input{width:18px;height:18px;accent-color:var(--bad)}
.switch.armed{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.cams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
figure{margin:0;position:relative}
figure img{display:block;width:100%;aspect-ratio:299/224;object-fit:cover;border-radius:10px;background:#0c0c0b}
figcaption{position:absolute;left:8px;top:8px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#f2f0ea}
.arm{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-top:14px}
.j{font-size:11.5px}
.j .bar{position:relative;height:56px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.j .fill{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--acc) 60%,transparent);transition:height .2s ease-out}
.j .goal{position:absolute;left:0;right:0;height:2px;background:var(--ink);opacity:.55}
.j .load{height:4px;border-radius:2px;margin-top:4px;background:var(--line);overflow:hidden}
.j .load i{display:block;height:100%;background:var(--warn)}
.j .nm{display:flex;justify-content:space-between;margin-top:3px;color:var(--mut)}
.kv{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--mut)}
.kv b{color:var(--ink);font-weight:600;font-family:var(--mono);font-size:12.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -14px 12px;padding:0 10px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mut);padding:8px 10px;font-weight:600}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
.tabs .count{font-weight:500;color:var(--faint);margin-left:4px}
.view[hidden]{display:none}
.tl{display:flex;flex-direction:column;max-height:70vh;overflow:auto}
.ev{display:grid;grid-template-columns:62px 112px minmax(0,1fr);gap:10px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:13px}
.ev:last-child{border-bottom:0}
.ev time{color:var(--faint);font-family:var(--mono);font-size:12px}
.k{font-size:11.5px;font-weight:650;color:var(--mut);text-transform:lowercase}
.k.advisor{color:var(--info)}.k.proposal{color:var(--acc)}.k.bad{color:var(--bad)}.k.ok{color:var(--ok)}.k.warn{color:var(--warn)}
.ev pre,.card pre{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;color:var(--mut)}
.ev .txt{white-space:pre-wrap;word-break:break-word}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:650;letter-spacing:.01em}
.SUCCEEDED,.pass{background:var(--ok-bg);color:var(--ok)}
.PARTIAL,.BLOCKED,.CANCELLED,.skipped,.running,.RUNNING,.QUEUED{background:var(--warn-bg);color:var(--warn)}
.REJECTED,.FAULT,.fail{background:var(--bad-bg);color:var(--bad)}
.done{background:var(--info-bg);color:var(--info)}
.execs{display:flex;flex-direction:column;gap:12px;max-height:74vh;overflow:auto}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.card h3{font-size:14px;margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .why{margin:6px 0 0;font-size:13px}
.card table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
.card td,.card th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.card th{font-weight:600;color:var(--mut)}
.card td.n{font-family:var(--mono);font-size:12px;color:var(--mut);word-break:break-word}
.phases{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.phase{border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-size:12px;min-width:92px}
.phase b{display:block;font-size:12.5px}
.phase.SUCCEEDED,.phase.pass,.phase.done{border-color:color-mix(in srgb,var(--ok) 40%,var(--line2))}
.phase.fail,.phase.FAULT,.phase.REJECTED{border-color:color-mix(in srgb,var(--bad) 45%,var(--line2))}
details summary{cursor:pointer;color:var(--mut);font-size:12.5px;margin-top:8px}
.empty{color:var(--faint);padding:18px 4px;text-align:center}
.prompt{max-height:46vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;
  white-space:pre-wrap;font-family:var(--mono);font-size:12px;color:var(--mut)}
.recs a{display:block;padding:6px 0;border-bottom:1px solid var(--line);text-decoration:none}
.recs a span{color:var(--mut);font-size:12.5px;margin-left:8px}
</style>
<header>
  <h1>ElRobot executor</h1>
  <span class=chip><span class=dot id=dBusy></span><span id=sBusy>idle</span></span>
  <span class=chip>backend <b id=sBackend>-</b></span>
  <span class=chip id=cArm hidden><span class=dot id=dArm></span><span id=sArm>arm disabled</span></span>
  <span class=chip>setup <b id=sSetup class=mono>-</b></span>
  <span class=chip>advisor <b id=sAdv>none</b></span>
  <span class=sp></span>
  <a id=lRec class=chip href="#" target=_blank rel=noopener hidden>recording</a>
</header>
<main>
<div class=stack>
  <section class=panel aria-labelledby=hTask>
    <h2 id=hTask>Task</h2>
    <textarea id=prompt placeholder="e.g. Put the black cube into the grey box, then park."></textarea>
    <label for=advisor>Advisor (runs in the background; proposes, never moves)</label>
    <div class=row><select id=advisor><option value=claude>Claude Code</option><option value=gemini>Gemini Robotics ER</option>
      <option value=none>None (manual proposals)</option></select>
      <select id=model aria-label="Claude model"><option value=sonnet>sonnet</option><option value=opus>opus</option><option value=haiku>haiku</option></select></div>
    <div class=row style="margin-top:12px"><button class=primary id=bStart>Start task</button><button id=bStop>Stop task</button>
      <button class=danger id=bCancel>Cancel motion</button></div>
    <div class=msg id=mTask></div>
  </section>
  <section class=panel aria-labelledby=hBack>
    <h2 id=hBack>Backend</h2>
    <div class=row><select id=backend aria-label=Backend><option value=fake>fake (deterministic, tests)</option>
      <option value=sim>sim (MuJoCo twin)</option><option value=real>real (Station, follower arm)</option></select>
      <button id=bBackend>Switch</button></div>
    <div class=switch id=armBox hidden><input type=checkbox id=arm><label for=arm style="margin:0;color:var(--ink)">
      <b>Arm enabled</b><br><span class=mut>Real motor commands. Off by default. Needs EXECUTOR_REAL_MOTION=1 at start.</span></label></div>
    <label for=tool>Tool attached (changes the setup id)</label>
    <div class=row><select id=tool><option>none</option><option>tissue</option><option>spoon</option><option>napkin</option></select></div>
    <div class=msg id=mBack></div>
  </section>
  <section class=panel aria-labelledby=hManual>
    <h2 id=hManual>Propose a skill</h2>
    <div class=row><select id=skill aria-label=Skill></select></div>
    <label for=params>Parameters (JSON, world frame, metres)</label>
    <textarea id=params class=code spellcheck=false>{}</textarea>
    <div class=faint id=pdoc style="font-size:12px;margin-top:4px"></div>
    <label for=why>Rationale</label>
    <input type=text id=why value="operator test">
    <div class=row style="margin-top:10px"><button id=bSubmit>Observe + submit</button></div>
    <div class=msg id=mSubmit></div>
  </section>
</div>
<div class=stack>
  <section class=panel aria-labelledby=hLive>
    <h2 id=hLive>Live</h2>
    <div class=cams><figure><img id=cWrist alt="Wrist camera"><figcaption>wrist</figcaption></figure>
      <figure><img id=cOver alt="Overview camera"><figcaption>overview</figcaption></figure></div>
    <div class=arm id=joints></div>
    <div class=kv><span>TCP (world) <b id=tcp>-</b></span><span>tilt <b id=tilt>-</b></span><span>gripper <b id=grip>-</b></span>
      <span>state age <b id=age>-</b></span><span>locator <b id=loc>-</b></span></div>
  </section>
  <section class=panel aria-labelledby=hLogic>
    <h2 id=hLogic class=sr hidden>Robot logic</h2>
    <div class=tabs role=tablist>
      <button role=tab aria-selected=true data-v=vExec>Executions<span class=count id=nExec></span></button>
      <button role=tab aria-selected=false data-v=vTl>Timeline<span class=count id=nTl></span></button>
      <button role=tab aria-selected=false data-v=vAdv>Advisor</button>
      <button role=tab aria-selected=false data-v=vRec>Recordings</button>
    </div>
    <div class=view id=vExec><div class=execs id=execs><div class=empty>No proposals yet. Start a task or propose a skill.</div></div></div>
    <div class=view id=vTl hidden><div class=row style="margin-bottom:8px"><label style="margin:0" class=row>
      <input type=checkbox id=fAdv checked> advisor</label><label style="margin:0" class=row><input type=checkbox id=fExec checked> executor</label>
      <label style="margin:0" class=row><input type=checkbox id=fObs> observations</label></div><div class=tl id=tl></div></div>
    <div class=view id=vAdv hidden><h2>Task prompt</h2><div class=prompt id=pTask>-</div>
      <h2 style="margin-top:14px">System prompt sent to the advisor</h2><div class=prompt id=pSys>-</div></div>
    <div class=view id=vRec hidden><div class=recs id=recs></div></div>
  </section>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>typeof v==='number'?(Math.abs(v)>=100||Number.isInteger(v)?String(v):v.toFixed(3)):Array.isArray(v)?'['+v.map(fmt).join(', ')+']':
  v&&typeof v==='object'?Object.entries(v).map(([k,x])=>k+' '+fmt(x)).join(', '):String(v);
const clock=t=>new Date(t*1000).toLocaleTimeString([], {hour12:false});
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({error:'bad response'}));if(!r.ok)throw new Error(j.error||r.status);return j;}
function say(el,text,err){$(el).textContent=text;$(el).classList.toggle('err',!!err);}

let S=null,skills={},seq=0,events=[];
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!==b.dataset.v);if(b.dataset.v==='vRec')recs();});

$('bStart').onclick=async()=>{try{const t=await api('/api/task/start',{prompt:$('prompt').value,advisor:$('advisor').value,model:$('model').value});
  say('mTask','started: recording '+t.recording_id);}catch(e){say('mTask',e.message,1)}};
$('bStop').onclick=async()=>{try{await api('/api/task/stop',{});say('mTask','stopped; motion cancelled, arm holds');}catch(e){say('mTask',e.message,1)}};
$('bCancel').onclick=async()=>{try{const r=await api('/api/cancel/current',{});say('mTask',r.cancelled?'cancel sent: no further commands':'nothing is moving');}catch(e){say('mTask',e.message,1)}};
$('bBackend').onclick=async()=>{say('mBack','switching (sim takes a few seconds to load)...');try{await api('/api/backend',{name:$('backend').value});say('mBack','backend '+$('backend').value);}catch(e){say('mBack',e.message,1)}};
$('arm').onchange=async()=>{try{const r=await api('/api/arm',{enabled:$('arm').checked});say('mBack',r.message,!r.can_move&&$('arm').checked);$('arm').checked=r.can_move;}catch(e){say('mBack',e.message,1);$('arm').checked=false}};
$('tool').onchange=async()=>{try{const r=await api('/api/tool',{tool:$('tool').value});say('mBack','setup '+r.setup_id+' (older observations are now rejected)');}catch(e){say('mBack',e.message,1)}};
$('advisor').onchange=()=>{$('model').hidden=$('advisor').value!=='claude'};
const EXAMPLES={move_tcp:p=>({xyz_world:[0.20,0.0,0.10]}),park:()=>({}),gripper:()=>({open_fraction:1.0}),pick:()=>({xyz_world:[0.16,-0.025,0.0],object_height:0.02}),
  place:()=>({xyz_world:[0.06,-0.24,0.19]}),stir:()=>({xyz_world:[0.24,0.0,0.06],radius:0.015,turns:2,clearance:0.06}),touch_table:()=>({xy_world:[0.22,0.03]})};
$('skill').onchange=()=>{const s=skills[$('skill').value];if(!s)return;$('params').value=JSON.stringify((EXAMPLES[s.name]||(()=>({})))(),null,0);
  $('pdoc').textContent=Object.entries(s.params).map(([k,v])=>k+': '+v).join(' · ')||'no parameters';};
$('bSubmit').onclick=async()=>{let params;try{params=JSON.parse($('params').value||'{}')}catch(e){return say('mSubmit','parameters are not valid JSON',1)}
  try{const r=await api('/api/submit',{skill:$('skill').value,params,rationale:$('why').value,ttl_s:30,source:'operator'});
    say('mSubmit',r.accepted?'accepted: '+r.execution_id:'rejected: '+r.reasons.join('; '),!r.accepted);execs();}catch(e){say('mSubmit',e.message,1)}};

async function state(){try{S=await api('/api/state');}catch(e){$('sBusy').textContent='console unreachable';$('dBusy').className='dot bad';return}
  $('sBusy').textContent=S.busy?'executing':S.task.state==='running'?'task running':'idle';$('dBusy').className='dot '+(S.busy?'busy':S.task.state==='running'?'on':'');
  $('sBackend').textContent=S.backend.name;$('sSetup').textContent=S.setup_id;$('sAdv').textContent=S.advisor?S.advisor.name+(S.advisor.running?' (running)':''):'none';
  const real=S.backend.name==='real';$('cArm').hidden=!real;$('armBox').hidden=!real;
  if(real){$('arm').checked=S.backend.can_move;$('armBox').classList.toggle('armed',S.backend.can_move);$('sArm').textContent=S.backend.can_move?'ARM ENABLED':'arm disabled (read only)';$('dArm').className='dot '+(S.backend.can_move?'bad':'')}
  if(document.activeElement!==$('backend'))$('backend').value=S.backend.name;$('tool').value=S.tool;$('loc').textContent=S.locator;
  $('bStart').disabled=S.task.state==='running';$('bStop').disabled=S.task.state!=='running';$('bCancel').disabled=!S.busy;$('bBackend').disabled=S.busy||S.task.state==='running';
  const v=S.recording.viewer||S.task.viewer;$('lRec').hidden=!v;if(v){$('lRec').href=v;$('lRec').textContent=(S.recording.id?'recording ':'last recording ')+(S.recording.id||S.task.recording_id||'')}}

function jointBars(js){const box=$('joints');if(box.children.length!==js.length)box.innerHTML=js.map(j=>`<div class=j><div class=bar><div class=fill></div><div class=goal></div></div><div class=load><i></i></div><div class=nm><span>${j.name}</span><span class=v></span></div></div>`).join('');
  js.forEach((j,i)=>{const el=box.children[i],n=Math.max(0,Math.min(1,j.norm??0)),g=Math.max(0,Math.min(1,j.goal_norm??n));
    el.querySelector('.fill').style.height=(n*100)+'%';el.querySelector('.goal').style.bottom=(g*100)+'%';el.querySelector('.load i').style.width=Math.min(100,j.load/10)+'%';
    el.querySelector('.v').textContent=(j.norm??0).toFixed(3);el.title=`${j.name}: norm ${j.norm} raw ${j.raw} goal ${j.goal} load ${j.load} temp ${j.temp} status ${j.status}${j.in_range?'':' OUT OF RANGE'}`;
    el.querySelector('.fill').style.background=j.status||!j.in_range?'var(--bad)':'';});}
async function live(){try{const L=await api('/api/live');jointBars(L.joints);$('tcp').textContent=fmt(L.tcp_world);$('tilt').textContent=L.tilt_deg+'°';
  const g=L.joints[L.joints.length-1];$('grip').textContent=(g.norm??0).toFixed(3)+' · load '+g.load;$('age').textContent=L.age_s+' s';}catch(e){}}

function camLoop(img,role){const next=()=>setTimeout(()=>{img.src='/api/cam/'+role+'.jpg?'+Date.now()},document.hidden?1500:250);img.onload=next;img.onerror=()=>setTimeout(next,1200);img.src='/api/cam/'+role+'.jpg?'+Date.now();}

const KIND={advisor_message:'advisor',advisor_tool_call:'advisor',advisor_tool_result:'advisor',advisor_prompt:'advisor',advisor_result:'advisor',advisor_end:'advisor',advisor_init:'advisor',advisor_command:'advisor',advisor_error:'bad'};
function evText(e){switch(e.kind){
  case'advisor_message':return`<div class=txt>${esc(e.text)}</div>`;
  case'advisor_tool_call':return`<b>${esc(e.tool)}</b><pre>${esc(JSON.stringify(e.input))}</pre>`;
  case'advisor_tool_result':return`<span class=mut>${e.images?e.images+' image(s) · ':''}</span><pre>${esc((e.text||'').slice(0,600))}</pre>`;
  case'advisor_prompt':return`task prompt sent (system prompt in the Advisor tab)<pre>${esc(e.task_prompt)}</pre>`;
  case'advisor_result':return`<div class=txt>${esc(e.text)}</div><span class=mut>${e.turns??'?'} turns · ${e.seconds??'?'} s${e.cost_usd!=null?' · $'+Number(e.cost_usd).toFixed(2):''}</span>`;
  case'proposal':return`<b>${esc(e.proposal.skill)}</b> from ${esc(e.proposal.source)} <span class=mut>${esc(e.proposal.rationale)}</span><pre>${esc(JSON.stringify(e.proposal.params))}</pre>`;
  case'validation':return e.ok?'<span class="pill pass">valid</span> '+checksLine(e.checks):'<span class="pill fail">rejected</span> '+esc(e.reasons.join('; '));
  case'phase':return`${esc(e.name)} <span class="pill ${esc(e.status)}">${esc(e.status)}</span> ${esc(e.termination||'')}`;
  case'note':return`<span class=mut>${esc(e.text)}</span>`;
  case'result':return`<span class="pill ${e.status}">${e.status}</span> ${esc(e.skill)}: ${esc(e.termination)} ${Object.keys(e.residuals||{}).length?'<pre>residuals '+esc(fmt(e.residuals))+'</pre>':''}`;
  case'outcome':return`${esc(e.metric)} = ${esc(e.value)} ${esc(e.unit)} → <b>${e.success===null?'unknown':e.success?'success':'failure'}</b>`;
  case'observation':return`<span class=mut>${esc(e.obs_id)} · freshness ${e.freshness_s} s · ${Object.entries(e.frames).map(([r,f])=>r+' seq '+f.seq+(f.stale?' STALE':'')).join(', ')} · ${e.objects} objects</span>`;
  case'task':return`task ${esc(e.state)} ${e.prompt?'<pre>'+esc(e.prompt)+'</pre>':''}${e.why?esc(e.why):''}`;
  case'advisor_end':return`advisor ended: ${esc(e.why)}`;
  default:return`<pre>${esc(JSON.stringify(Object.fromEntries(Object.entries(e).filter(([k])=>!['seq','t','kind'].includes(k)))))}</pre>`;}}
function checksLine(c){return Object.entries(c||{}).filter(([k])=>k!=='validation_s').map(([k,v])=>`${k} ${v.result}`).join(' · ')}
function kindClass(e){if(KIND[e.kind])return KIND[e.kind];if(e.kind==='proposal')return'proposal';if(e.kind==='result')return e.status==='SUCCEEDED'?'ok':'bad';
  if(e.kind==='validation')return e.ok?'ok':'bad';if(e.kind==='cancel')return'warn';return'';}
function drawTl(){const a=$('fAdv').checked,x=$('fExec').checked,o=$('fObs').checked;
  const show=events.filter(e=>e.kind==='observation'?o:e.kind.startsWith('advisor_')?a:x).slice(-400).reverse();
  $('tl').innerHTML=show.length?show.map(e=>`<div class=ev><time>${clock(e.t)}</time><span class="k ${kindClass(e)}">${esc(e.kind.replace('advisor_','advisor · ').replace('_',' '))}</span><div>${evText(e)}</div></div>`).join(''):'<div class=empty>Nothing yet.</div>';
  $('nTl').textContent=events.length||'';}
['fAdv','fExec','fObs'].forEach(i=>$(i).onchange=drawTl);
async function timeline(){try{const r=await api('/api/timeline?since='+seq);if(r.events.length){events=events.concat(r.events).slice(-1500);seq=r.seq;drawTl();
  if(r.events.some(e=>['proposal','validation','result','phase','outcome'].includes(e.kind)))execs();
  if(r.events.some(e=>e.kind==='advisor_prompt'))advisor();}}catch(e){}}

function checksTable(c){return'<table><tr><th>check</th><th>result</th><th>numbers</th></tr>'+Object.entries(c||{}).map(([k,v])=>{const {result,...n}=v;
  return`<tr><td>${esc(k)}</td><td><span class="pill ${esc(result)}">${esc(result)}</span></td><td class=n>${esc(fmt(n))}</td></tr>`}).join('')+'</table>'}
function phasesRow(ps){return'<div class=phases>'+ps.map(p=>{const s=p.status||'';const dur=p.start!=null&&p.end!=null?(p.end-p.start).toFixed(1)+' s':p.seconds!=null?p.seconds+' s':'';
  return`<div class="phase ${esc(s)}" title="${esc((p.notes||[]).join('\n'))}"><b>${esc(p.name)}</b><span class="pill ${esc(s)}">${esc(s)}</span> <span class=faint>${dur}</span></div>`}).join('')+'</div>'}
async function execs(){let r;try{r=await api('/api/executions')}catch(e){return}$('nExec').textContent=r.executions.length||'';
  if(!r.executions.length)return;
  $('execs').innerHTML=r.executions.map(x=>{const p=x.proposal||{};const v=x.validation||{};const notes=(x.phases||[]).flatMap(ph=>(ph.notes||[]).map(n=>ph.name+': '+n));
    return`<article class=card><h3>${esc(x.skill)} <span class="pill ${x.status}">${x.status}</span><span class=faint style="font-weight:500">${esc(p.source)} · ${esc(x.execution_id)}</span></h3>
    ${p.rationale?`<p class=why>${esc(p.rationale)}</p>`:''}<pre>params ${esc(JSON.stringify(p.params))}</pre>
    <p class=why><b>${esc(x.termination)}</b></p>
    ${Object.keys(x.residuals||{}).length?`<pre>residuals ${esc(fmt(x.residuals))}</pre>`:''}
    ${Object.keys(x.achieved||{}).length?`<pre>measured ${esc(fmt(x.achieved))}</pre>`:''}
    ${phasesRow(x.phases||[])}
    <details ${x.status==='REJECTED'?'open':''}><summary>validation: ${v.ok?'passed':'failed'} (${Object.keys(v.checks||{}).length} checks)</summary>${checksTable(v.checks)}</details>
    ${notes.length?`<details><summary>execution log (${notes.length})</summary><pre>${esc(notes.join('\n'))}</pre></details>`:''}
    <div class=row style="margin-top:10px">${['SUCCEEDED','PARTIAL','BLOCKED','FAULT','CANCELLED'].includes(x.status)?`<button data-eval="${x.execution_id}">Evaluate independently</button>`:''}
    ${x.viewer?`<a href="${esc(x.viewer)}" target=_blank rel=noopener>replay in the recorder</a>`:''}<span class=mut id="o-${x.execution_id}"></span></div></article>`}).join('');
  $('execs').querySelectorAll('[data-eval]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const o=await api('/api/evaluate/'+b.dataset.eval,{});
    $('o-'+b.dataset.eval).textContent=`${o.metric} = ${o.value} ${o.unit} → ${o.success===null?'unknown':o.success?'success':'failure'}`;}catch(e){$('o-'+b.dataset.eval).textContent=e.message}b.disabled=false;});}
async function advisor(){try{const a=await api('/api/advisor');$('pTask').textContent=a.task_prompt||'-';$('pSys').textContent=a.system_prompt||'(no advisor started yet)';}catch(e){}}
async function recs(){try{const r=await api('/api/recordings');const row=s=>`<a href="${esc(s.viewer)}" target=_blank rel=noopener>${esc(s.id)}<span>${esc(s.duration!=null?Number(s.duration).toFixed(0)+' s':'active')} · ${esc(s.markers??0)} markers</span></a>`;
  $('recs').innerHTML='<h2>Executor runs (fake / sim / replay)</h2>'+(r.local.map(row).join('')||'<div class=empty>none</div>')+'<h2 style="margin-top:14px">Recorder service (real arm, :8900)</h2>'+(r.service.map(row).join('')||'<div class=empty>recorder service not reachable</div>');}catch(e){}}
(async()=>{skills=await api('/api/skills');$('skill').innerHTML=Object.keys(skills).map(k=>`<option>${k}</option>`).join('');$('skill').onchange();
  await state();advisor();execs();timeline();live();camLoop($('cWrist'),'wrist');camLoop($('cOver'),'overview');
  setInterval(state,1000);setInterval(live,300);setInterval(timeline,500);})();
</script>
</html>
