[project]
name = "generaloid"
version = "0.1.0"
description = "Robot MCP connectors and digital twins around NormaCore Station"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["mcp>=1.12,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
sim = ["numpy>=2,<3", "scipy>=1.14,<2", "pillow>=11,<13", "mujoco>=3.3,<4", "opencv-contrib-python>=4.10,<5"]
real = ["numpy>=2,<3", "scipy>=1.14,<2", "pillow>=11,<13", "mujoco>=3.3,<4", "opencv-contrib-python>=4.10,<5"]
gemini = ["google-genai==3.3.0"]
dev = ["pytest>=8,<10", "reportlab>=4,<5"]

[tool.uv]
# Legacy modules and calibrated assets are resolved relative to this source tree.
# This release deliberately supports source-checkout execution, not wheel installation.
package = false

[tool.pytest.ini_options]
testpaths = ["system2/tests", "recorder/tests", "executor/tests", "executor/console/tests", "tests", "skills/tests", "models/tests", "tasks/tests", "learning/tests", "dashboard/tests", "generaloid/tests", "generaloid/comms/tests", "sim/test_selftest.py"]
norecursedirs = [".git", ".venv", ".local", "norma-core", "generated", ".generated"]
